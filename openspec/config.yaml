schema: spec-driven
context: |
  Professional English Coach is a browser-based practice tool for advanced professional English.
  Current implementation: single learner with local-only data, bilingual pre-practice instruction, progressive text exercises, one owner-authorized synthetic audio cloze with transcript, optional browser speech recognition/playback, and opt-in server-side AI suggestions after authored exercises. The audio's voice/output rights and pronunciation have not been independently reviewed; the owner accepted this risk for personal/family learning and existing public hosting.
  Optional lesson audio/video uses static assets with text alternatives. VoiceStudio may be evaluated as a local content-authoring tool but is not a runtime dependency or service exposed to learners. Do not represent owner authorization as legal clearance, and never claim that the app provides validated assessment, CEFR scores, pronunciation scores or learning outcomes.
  The existing Sites deployment is public. Learner answers and progress remain in local browser storage; there is no account or cloud sync.
  Write testable requirements with MUST/SHALL and GIVEN/WHEN/THEN scenarios.
  Distinguish shipped behavior from proposed changes. Never claim CEFR certification or learning outcomes.
